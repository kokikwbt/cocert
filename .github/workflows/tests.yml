name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install the locked environment
        run: |
          python -m pip install uv==0.12.1
          uv sync --frozen --all-extras
      - name: Check the code and proof contracts
        run: uv run --frozen --all-extras python -m pytest -q
      - name: Replay independent examples
        run: |
          python -I -S scripts/verify_offline.py examples/toy.jsonl examples/toy-proofs.jsonl
          python -I -S scripts/verify_offline.py examples/real-small.jsonl examples/real-small-proofs.jsonl
          python -I -S scripts/verify_archive_example.py
          python -I -S scripts/verify_audit_record.py examples/audit-record
          python -I -S scripts/reproduce_table8.py
      - name: Check the source archive
        run: python scripts/package_release.py
